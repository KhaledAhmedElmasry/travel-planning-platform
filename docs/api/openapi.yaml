          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel not found.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}/policies:
    put:
      operationId: putHotelsByIdPolicies
      tags: [Hotels and Rooms]
      summary: 'Set check-in/check-out times and cancellation tiers (HTL-08, HTL-10)'
      description: |
        **Access:** the hotel moderator assigned to this hotel.

        Sets the standard check-in and check-out times, shown on the hotel page and the booking summary
        (HTL-09), and replaces the cancellation tiers (HTL-10). Each tier has a unique
        days-before-check-in threshold and a refund percentage from 0 to 100, applied with the same rule
        as FLT-09: the tier with the highest threshold not exceeding the days remaining; 0% if none
        applies.

        Note: the PDF table lists HTL-08 and HTL-10 for this endpoint. HTL-08 is the room status view
        (`GET /api/hotels/{id}/availability`); the check-in/check-out times are HTL-09.
      security: *auth
