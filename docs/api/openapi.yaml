            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of the reviewed hotel.", "path": "/api/reviews/665f1c2a9b1e8a00123400a1/reply", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Review not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Review not found.", "path": "/api/reviews/665f1c2a9b1e8a00123400a1/reply", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The review already has a reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The review already has a reply.", "path": "/api/reviews/665f1c2a9b1e8a00123400a1/reply", "timestamp": "2026-11-01T10:00:00.000Z"}

  # ---------------------------------------------------------------------------
  # 8.7 Payments and Refunds
  # ---------------------------------------------------------------------------

  /api/bookings/{type}/{id}/policies:
    get:
      operationId: getBookingsByTypeByIdPolicies
      tags: [Payments and Refunds]
      summary: 'Get the provider policies to accept before payment (PAY-02)'
      description: |
        **Access:** the user who made the booking.

        - Flight booking: the airline's cancellation tiers and baggage policy (free allowance per cabin,
          extra-bag price and maximum).
        - Hotel reservation: the hotel's cancellation tiers and check-in/check-out times.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/BookingTypePath'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: |
            `{ bookingType, bookingId, currency, policies, acceptedAt }`. `acceptedAt` is null until the
            user accepts. `policies` for a flight: `airline {id, name}`, `cancellationTiers`
            (highest daysBefore first), `baggage {cabins: [{flightId, flightNumber, cabinClass, freeBags,
            maxBagWeightKg}], extraBagPrice (cents), maxExtraBagsPerPassenger}`. For a hotel:
            `hotel {id, name}`, `cancellationTiers`, `checkInTime`, `checkOutTime`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPoliciesResponse'
        '400':
          description: type is not flight or hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "type must be \"flight\" or \"hotel\"", "path": "/api/bookings/flight/665f1c2a9b1e8a00123400a1/policies", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/bookings/flight/665f1c2a9b1e8a00123400a1/policies", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Booking not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking not found.", "path": "/api/bookings/flight/665f1c2a9b1e8a00123400a1/policies", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/bookings/{type}/{id}/accept-policies:
    post:
      operationId: postBookingsByTypeByIdAcceptPolicies
      tags: [Payments and Refunds]
      summary: 'Accept the provider policies (PAY-02)'
      description: |
        **Access:** the user who made the booking.

        Records the acceptance with a timestamp on the booking. Payment is blocked until the policies
        are accepted. Only for a `pending_payment` booking whose hold has not expired. Accepting again
        returns the first acceptance time.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/BookingTypePath'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptPoliciesRequest'
      responses:
        '200':
          description: 'Accepted: `{ bookingType, bookingId, acceptedAt }`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptPoliciesResponse'
        '400':
          description: accepted is not true, or type is not flight or hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Validation failed", "fieldErrors": [{"field": "accepted", "messages": ["accepted must be true"]}], "path": "/api/bookings/flight/665f1c2a9b1e8a00123400a1/accept-policies", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/bookings/flight/665f1c2a9b1e8a00123400a1/accept-policies", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Booking not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking not found.", "path": "/api/bookings/flight/665f1c2a9b1e8a00123400a1/accept-policies", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The booking is not pending payment, or its hold has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The hold on this booking has expired. Please book again.", "path": "/api/bookings/flight/665f1c2a9b1e8a00123400a1/accept-policies", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/payments:
    post:
      operationId: postPayments
      tags: [Payments and Refunds]
      summary: 'Pay for a booking with Stripe test mode (PAY-01)'
      description: |
        **Access:** the user who made the booking.

        Creates a Stripe PaymentIntent (test mode) for the booking total in the platform currency
        (PAY-04). Card details never reach the backend: the frontend confirms the payment with Stripe
        Elements using `clientSecret`. To test from Swagger, send a Stripe test payment method in
        `paymentMethodId` (`pm_card_visa` succeeds, `pm_card_chargeDeclined` fails) and the backend
        confirms the PaymentIntent with it.

        The booking becomes Confirmed **only** after the backend verifies through the Stripe webhook
        that the PaymentIntent succeeded (FLT-23, HTL-17). Only the Stripe payment id, amount, currency
        and status are stored.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment created - id, status, amount in cents, currency, Stripe payment id and clientSecret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid fields, or the policies were not accepted yet (PAY-02).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Accept the provider policies before paying (PAY-02).", "path": "/api/payments", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/payments", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Booking not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking not found.", "path": "/api/payments", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The booking is not pending payment, its hold has expired, it is already paid, or its last payment failed (use the retry endpoint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "This booking is already paid.", "path": "/api/payments", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/payments/{id}/retry:
    post:
      operationId: postPaymentsByIdRetry
      tags: [Payments and Refunds]
      summary: 'Retry a failed payment (PAY-01)'
      description: |
        **Access:** the user who made the payment.

        After a failed payment the user may retry until the hold expires. The retry uses the same
        payment and Stripe PaymentIntent, so a booking can never be charged twice. When the hold
        expires, the PaymentIntent is cancelled and the booking becomes `expired`.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryPaymentRequest'
      responses:
        '201':
          description: The payment, back to pending, for a new attempt (same fields as POST /api/payments).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: paymentMethodId is not a Stripe payment method id (pm_...).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Validation failed", "fieldErrors": [{"field": "paymentMethodId", "messages": ["paymentMethodId must be a Stripe payment method id (pm_...)"]}], "path": "/api/payments/665f1c2a9b1e8a00123400a1/retry", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/payments/665f1c2a9b1e8a00123400a1/retry", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Payment not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Payment not found.", "path": "/api/payments/665f1c2a9b1e8a00123400a1/retry", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The payment did not fail, or the hold has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "Only a failed payment can be retried; this payment is succeeded.", "path": "/api/payments/665f1c2a9b1e8a00123400a1/retry", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/payments/{id}:
    get:
      operationId: getPaymentsById
      tags: [Payments and Refunds]
      summary: 'Get a payment and its status (PAY-01)'
      description: |
        **Access:** the user who made the payment.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Booking type and id, amount in cents, currency, status (pending, succeeded, failed, cancelled), Stripe payment id, dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/payments/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Payment not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Payment not found.", "path": "/api/payments/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/payments/webhook:
    post:
      operationId: postPaymentsWebhook
      tags: [Payments and Refunds]
      summary: 'Stripe webhook (PAY-01)'
      description: |
        **Access:** called by Stripe only (no login). The request is verified with the
        `stripe-signature` header and the raw request body. Locally, run
        `stripe listen --events payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,refund.created,refund.updated,refund.failed --forward-to localhost:3000/api/payments/webhook`
        and put the `whsec_...` secret it prints in `STRIPE_WEBHOOK_SECRET`.

        - `payment_intent.succeeded`: confirms the booking - held seats become booked seats, or the
          reservation's rooms are confirmed - generates a unique booking reference and sends an in-app
          notification (FLT-23, HTL-17). If the hold had already expired, the payment is refunded.
        - `payment_intent.payment_failed`: marks the payment failed; the booking stays pending and the
          user may retry until the hold expires.
        - `refund.created`, `refund.updated`, `refund.failed`: update the refund status (PAY-03) from
          the refund's current state in Stripe.
      security: []
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Stripe event.
      responses:
        '200':
          description: Event received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    enum: [true]
                    example: true
        '400':
          description: Missing or invalid signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid Stripe signature.", "path": "/api/payments/webhook", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/refunds/{id}:
    get:
      operationId: getRefundsById
      tags: [Payments and Refunds]
      summary: 'Get a refund and its status (PAY-03)'
      description: |
        **Access:** the user who owns the refunded booking.

        A refund is created for every cancellation with a positive amount: user cancellations use the
        provider's tiers, provider cancellations refund 100%. A payment confirmed after its hold expired
        is also refunded 100%. It is issued through the Stripe Refunds API, at most one per booking.
        The amount is the percentage of the amount paid, rounded down to whole cents.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: |
            id, bookingType, bookingId, paymentId, amount (cents), currency, refundPercentage,
            tierDaysBefore (the tier used for a user cancellation, otherwise null), reason
            (user_cancellation, provider_cancellation, hold_expired), status (pending, refunded,
            failed), stripeRefundId, failureReason, createdAt, updatedAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/refunds/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Refund not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Refund not found.", "path": "/api/refunds/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  # ---------------------------------------------------------------------------
  # 8.8 Itineraries
  # ---------------------------------------------------------------------------
  # Private itineraries and everything inside them (days, activities, budget entries, transport
  # costs) are accessible only to their owner (ACC-11). Another user's private itinerary gives 404.

  /api/itineraries:
    post:
      operationId: postItineraries
      tags: [Itineraries]
      summary: 'Create an itinerary (ITN-01)'
      description: |
        **Access:** registered users (role `user`).

        Creates an itinerary with a title, one or more countries from the predefined list (NEW-05) and a
        start date. It is private by default (ITN-20). Days are added with
        `POST /api/itineraries/{id}/days`.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItineraryRequest'
      responses:
        '201':
          description: Itinerary created (private, no days yet).
        '400':
          description: Invalid fields or a country not in the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid fields or a country not in the list.", "path": "/api/itineraries", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not a registered user.", "path": "/api/itineraries", "timestamp": "2026-11-01T10:00:00.000Z"}
    get:
      operationId: getItineraries
      tags: [Itineraries]
      summary: 'List own itineraries (ITN-03)'
      description: |
        **Access:** registered users. Only the user's own itineraries, most recently updated first.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Each item - id, title, countries, start date, number of days, visibility.
          content: *paginated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/itineraries/{id}:
    get:
      operationId: getItinerariesById
      tags: [Itineraries]
      summary: 'Get own itinerary details (ITN-03)'
      description: |
        **Access:** the owner.

        Day dates are derived from the start date and the order of the days. Consecutive days in the
