openapi: 3.0.3
info:
  title: Travel Planning & Booking Platform API
  version: 1.0.0
  license:
    name: Private coursework (GIU Software Project I) - not licensed for reuse
    url: https://github.com/KhaledAhmedElmasry/travel-planning-platform
  description: |
    Software Project I, Winter 2026, German International University. Milestone 1 backend API.

    This file (`docs/api/openapi.yaml`) documents every endpoint of **PDF section 8**, grouped and
    ordered like the PDF tables. The requirement IDs in each summary refer to the official requirements
    workbook in `docs/requirements/`.

    - **Not implemented yet?** "Try it out" returns `404 Cannot ...` until the endpoint is implemented.
    - **Logging in:** call `POST /api/auth/login`. It sets httpOnly cookies (ACC-19) and the browser
      sends them with every later request automatically, so the Authorize button is not needed.
      A lock icon marks the endpoints that need login.
    - **Errors:** every error uses the `Error` format (see Schemas at the bottom). Validation errors
      list each invalid field in `fieldErrors` (GEN-02). The example under each error code shows that
      code and a typical message; for implemented endpoints it is the real message.
    - **Lists:** every list returns pages of 10 items in the `PaginatedList` format; request another
      page with `?page=2` (GEN-05). No results is an empty page, not an error (GEN-04).
    - **Money:** flight and hotel prices, booking totals, payments and refunds are integers in cents of
      the platform currency, e.g. `25000` = 250.00 USD (PAY-04, NEW-04). Itinerary budget amounts are
      decimal numbers in any currency (ITN-14).
    - **Dates and times:** dates are `YYYY-MM-DD`. Flight times are entered in each airport's local
      time as `YYYY-MM-DDTHH:mm`, stored in UTC and shown in the airport's local time zone
      (FLT-03, GEN-06).
    - **[Bonus]** marks optional endpoints (PDF section 12). Remove the ones you do not implement
      before the submission.
    - **Keep this file up to date:** when you add or change an endpoint, update this file in the
      same pull request.

servers:
  - url: /
    description: The server this page is served from

# Reusable YAML blocks (anchors), used below as *paginated and *auth. *error is the bare Error
# format; prefer writing an `example` with the real status code and message for each response
# (as below), otherwise Swagger shows the same 400 example for every error.
x-shared:
  error: &error
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
  paginated: &paginated
    application/json:
      schema:
        $ref: '#/components/schemas/PaginatedList'
  auth: &auth
    - cookieAuth: []

tags:
  - name: Authentication and Accounts
    description: PDF section 8.1
  - name: Administration
    description: PDF section 8.2 (admin only)
  - name: 'Airlines, Flights, and Flight Inventory'
    description: PDF section 8.3
  - name: Flight Booking
    description: PDF section 8.4
  - name: Hotels and Rooms
    description: PDF section 8.5
  - name: Hotel Booking and Reviews
    description: PDF section 8.6
  - name: Payments and Refunds
    description: PDF section 8.7
  - name: Itineraries
    description: PDF section 8.8
  - name: Blog
    description: PDF section 8.9
  - name: Health
    description: Not a requirement. Checks that the server and the database connection work.

paths:

  # ---------------------------------------------------------------------------
  # 8.1 Authentication and Accounts
  # ---------------------------------------------------------------------------

  /api/auth/register:
    post:
      operationId: postAuthRegister
      tags: [Authentication and Accounts]
      summary: 'Register a new account (ACC-01, ACC-03)'
      description: |
        **Access:** guests.

        Creates an account with role `user` and status `active`. The email is trimmed, lowercased and
        must be unique. The password is stored only as a salted hash (GEN-13) and is never returned.
        A `role` sent in the body is ignored: admins are seeded (ACC-18) and moderators are created by
        an admin (ACC-13). The time the consent was given is stored with the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. Returns the profile (id, name, email, role, status, createdAt) without any password fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '400':
          description: Invalid email, a password that breaks the rules, or consent not given. fieldErrors names each invalid field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Validation failed", "fieldErrors": [{"field": "email", "messages": ["Enter a valid email address"]}], "path": "/api/auth/register", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "An account with this email already exists", "path": "/api/auth/register", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/auth/verify-email:
    get:
      operationId: getAuthVerifyEmail
      tags: [Authentication and Accounts]
      summary: '[Bonus] Verify the email address (ACC-02)'
      description: |
        **Access:** guests (the user opens the link sent by email after registration).

        Marks the email as verified. Booking is blocked until the email is verified (ACC-02).
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The token from the verification link.
          schema:
            type: string
      responses:
        '200':
          description: Email verified.
        '400':
          description: The token is invalid, expired or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "The token is invalid, expired or already used.", "path": "/api/auth/verify-email", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/auth/login:
    post:
      operationId: postAuthLogin
      tags: [Authentication and Accounts]
      summary: 'Log in (ACC-04, ACC-05)'
      description: |
        **Access:** guests. Works for every role.

        On success the response sets two httpOnly, Secure, SameSite cookies: `access_token` (short-lived)
        and `refresh_token` (ACC-19, NEW-07). Tokens are never returned in the body or stored in
        localStorage/sessionStorage. The frontend uses the returned role to open the role's home page.

        After 5 consecutive failed attempts the account is locked for 15 minutes; a successful login
        resets the counter (ACC-05).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Logged in; the cookies are set. Returns the account: id, name, email, role, the assigned
            airlineId or hotelId for moderators, and mustChangePassword. When mustChangePassword is
            true (temporary password, ACC-07a and ACC-13), the account must call
            `PATCH /api/auth/change-password` before using other endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Email or password missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Validation failed", "fieldErrors": [{"field": "email", "messages": ["Enter a valid email address"]}], "path": "/api/auth/login", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          description: The generic message "invalid email or password". It never says which one was wrong (ACC-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 401, "error": "UNAUTHORIZED", "message": "Invalid email or password", "path": "/api/auth/login", "timestamp": "2026-11-01T10:00:00.000Z"}
        '403':
          description: The account is suspended ("account suspended"), deactivated, or locked for 15 minutes after 5 failed attempts (ACC-05).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Account locked after 5 failed login attempts. Try again in 15 minutes", "path": "/api/auth/login", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Authentication and Accounts]
      summary: 'Log out (ACC-06)'
      description: |
        **Access:** logged-in accounts.

        Clears both auth cookies and revokes the refresh token on the server. Separately, a session with
        no authenticated request for 30 minutes expires and needs a new login (ACC-06, NEW-07).
      security: *auth
      responses:
        '204':
          description: Logged out; the cookies are cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags: [Authentication and Accounts]
      summary: '[Bonus] Request a password reset link by email (ACC-07)'
      description: |
        **Access:** guests.

        Emails a reset link that expires after 30 minutes, works once, and is invalidated by a newer
        request. The response is the same whether or not the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Always the same message, e.g. "If the email exists, a reset link was sent".
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/auth/reset-password:
    post:
      operationId: postAuthResetPassword
      tags: [Authentication and Accounts]
      summary: '[Bonus] Set a new password with a reset link (ACC-07)'
      description: |
        **Access:** guests (with the token from the reset email).

        Sets the new password and revokes all sessions of the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed. The user logs in with the new password.
        '400':
          description: The token is invalid, expired or already used, or the new password breaks the rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "The token is invalid, expired or already used, or the new password breaks the rules.", "path": "/api/auth/reset-password", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/admin/users/{id}/reset-password:
    post:
      operationId: postAdminUsersByIdResetPassword
      tags: [Authentication and Accounts]
      summary: 'Admin resets a password to a temporary one (ACC-07a)'
      description: |
        **Access:** admin.

        Sets a temporary password for a registered user or a moderator and revokes all sessions of the
        account (NEW-07). The account must set a new password that meets the password rules at its next
        login (mustChangePassword). The action is written to the audit log (GEN-07).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '200':
          description: Password reset. The account must change it at its next login.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/admin/users/665f1c2a9b1e8a00123400a1/reset-password", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Account not found.", "path": "/api/admin/users/665f1c2a9b1e8a00123400a1/reset-password", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/auth/change-password:
    patch:
      operationId: patchAuthChangePassword
      tags: [Authentication and Accounts]
      summary: 'Change own password (ACC-08)'
      description: |
        **Access:** logged-in accounts, including accounts that must change a temporary password.

        Needs the current password. The new password must meet the password rules (ACC-01). Clears
        mustChangePassword (ACC-07a, ACC-13).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed.
        '400':
          description: The current password is wrong, or the new password breaks the rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "The current password is wrong, or the new password breaks the rules.", "path": "/api/auth/change-password", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      operationId: getAuthMe
      tags: [Authentication and Accounts]
      summary: 'Get the logged-in account (ACC-04, ACC-11)'
      description: |
        **Access:** logged-in accounts.

        Returns the account of the current session, read from the httpOnly cookie. The frontend calls
        this endpoint instead of keeping tokens or user data in JavaScript-accessible storage (ACC-19).
      security: *auth
      responses:
        '200':
          description: The account - id, name, email, role, status, the assigned airlineId or hotelId for moderators, and mustChangePassword.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me:
    get:
      operationId: getUsersMe
      tags: [Authentication and Accounts]
      summary: 'Get own profile (ACC-11)'
      description: |
        **Access:** logged-in accounts. Only the own profile can be read.
      security: *auth
      responses:
        '200':
          description: The profile - id, name, email, phone, preferredCurrency, role, status, createdAt.
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: patchUsersMe
      tags: [Authentication and Accounts]
      summary: 'Edit own profile (ACC-09)'
      description: |
        **Access:** logged-in accounts.

        Edits name, phone number and preferred currency. Nothing is saved unless all sent fields pass
        validation. The preferred currency must be in the supported currency list (GEN-12) and is
        used only to display itinerary budgets (ITN-18, NEW-04).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated profile.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteUsersMe
      tags: [Authentication and Accounts]
      summary: 'Deactivate own account (ACC-12)'
      description: |
        **Access:** registered users (role `user`). The frontend asks for confirmation first (GEN-03).

        Blocked while the user has upcoming Confirmed bookings (a flight not yet departed, or a stay not
        yet started). After deactivation the user cannot log in and all sessions are revoked; their
        posts and public itineraries are hidden, and their comments and reviews are shown as
        "Deleted user".
      security: *auth
      responses:
        '204':
          description: Account deactivated; the cookies are cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not a registered user.", "path": "/api/users/me", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The user still has upcoming Confirmed bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The user still has upcoming Confirmed bookings.", "path": "/api/users/me", "timestamp": "2026-11-01T10:00:00.000Z"}

  # ---------------------------------------------------------------------------
  # 8.2 Administration
  # ---------------------------------------------------------------------------

  /api/admin/moderators:
    post:
      operationId: postAdminModerators
      tags: [Administration]
      summary: 'Create a hotel or airline moderator (ACC-13)'
      description: |
        **Access:** admin.

        Creates a moderator account linked to exactly one existing airline or hotel, with a temporary
        password set by the admin. The moderator must change the password at first login. The action
        is written to the audit log (GEN-07).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModeratorRequest'
      responses:
        '201':
          description: Moderator created. Returns the account (id, name, email, role, airlineId or hotelId, status) without the password.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/admin/moderators", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: The airline or hotel does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "The airline or hotel does not exist.", "path": "/api/admin/moderators", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The email is already registered.", "path": "/api/admin/moderators", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/admin/accounts:
    get:
      operationId: getAdminAccounts
      tags: [Administration]
      summary: 'List all accounts (ACC-14)'
      description: |
        **Access:** admin.

        Paginated list of all accounts. Search by name or email, and filter by role and status.
      security: *auth
      parameters:
        - name: search
          in: query
          description: Part of the name or email (case-insensitive).
          schema:
            type: string
            example: mona
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Each item - id, name, email, role, status, registration date.
          content: *paginated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/admin/accounts", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/admin/accounts/{id}/suspend:
    patch:
      operationId: patchAdminAccountsByIdSuspend
      tags: [Administration]
      summary: 'Suspend a user or moderator (ACC-15, ACC-16)'
      description: |
        **Access:** admin. Admin accounts cannot be suspended.

        A suspended account cannot log in and all its sessions are revoked (NEW-07). Its existing
        bookings remain valid, and its content stays visible unless hidden through GEN-10 (ACC-16).
        The account gets an in-app notification (GEN-01) and the action is written to the audit log
        (GEN-07).

        Note: ACC-15 also covers deactivating and reactivating a hotel or airline. The PDF has no
        endpoint for that; add one to this file when it is designed.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: The account with status `suspended`.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or the target is an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin, or the target is an admin.", "path": "/api/admin/accounts/665f1c2a9b1e8a00123400a1/suspend", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Account not found.", "path": "/api/admin/accounts/665f1c2a9b1e8a00123400a1/suspend", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The account is not active (already suspended or deactivated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The account is not active (already suspended or deactivated).", "path": "/api/admin/accounts/665f1c2a9b1e8a00123400a1/suspend", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/admin/accounts/{id}/reactivate:
    patch:
      operationId: patchAdminAccountsByIdReactivate
      tags: [Administration]
      summary: 'Reactivate a suspended user or moderator (ACC-15, ACC-16)'
      description: |
        **Access:** admin.

        The account can log in again. It gets an in-app notification (GEN-01) and the action is written
        to the audit log (GEN-07).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: The account with status `active`.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/admin/accounts/665f1c2a9b1e8a00123400a1/reactivate", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Account not found.", "path": "/api/admin/accounts/665f1c2a9b1e8a00123400a1/reactivate", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The account is not suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The account is not suspended.", "path": "/api/admin/accounts/665f1c2a9b1e8a00123400a1/reactivate", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/admin/airlines/{id}/deactivate:
    patch:
      operationId: patchAdminAirlinesByIdDeactivate
      tags: [Administration]
      summary: 'Deactivate an airline (ACC-15)'
      description: |
        **Access:** admin.

        Deactivates an airline. Its flights are hidden from search and cannot be booked; existing confirmed
        bookings remain valid. The assigned moderator receives an in-app notification (GEN-01) and the action
        is written to the audit log (GEN-07).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequest'
      responses:
        '200':
          description: Airline deactivated. Returns status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: '665f1c2a9b1e8a00123400c3'
                  active:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Airline deactivated successfully.'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/admin/airlines/665f1c2a9b1e8a00123400c3/deactivate", "timestamp": "2026-11-01T10:00:00.000Z"}
