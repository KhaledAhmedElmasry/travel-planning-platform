  # ---------------------------------------------------------------------------
  # 8.4 Flight Booking
  # ---------------------------------------------------------------------------

  /api/flight-bookings/hold:
    post:
      operationId: postFlightBookingsHold
      tags: [Flight Booking]
      summary: 'Proceed to payment - hold the seats for 10 minutes (FLT-22)'
      description: |
        **Access:** registered users (role `user`). A guest gets 401 and the frontend sends them to
        login and back (ACC-10).

        Send the same body as `POST /api/flight-bookings` after the user has reviewed the summary.
        The seats are reserved atomically and only if enough remain, so concurrent requests can never
        book more seats than available. The booking is created with status `pending_payment` and a
        10-minute hold (`holdExpiresAt`). The prices agreed now are stored on the booking (NEW-02).

        Next steps: `GET /api/bookings/flight/{id}/policies`, accept them, then `POST /api/payments`.
        If the payment does not succeed within the hold, the booking becomes `expired` and the seats
        are released (NEW-01).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightBookingRequest'
      responses:
        '201':
          description: |
            Booking created - `id`, `reference` (null until confirmed), `status` pending_payment,
            `holdExpiresAt`, `segments` (flight number, airline, cabin, airports, `departureAt` /
            `arrivalAt` in UTC and `departureLocal` / `arrivalLocal` in each airport's time zone, fare,
            free bags), `passengers` (with fare and baggage fee), `seats` (adults + children),
            `totalAmount` in cents, `currency`, `policiesAcceptedAt`, `paymentId`,
            and the time of each status change (`confirmedAt`, `expiredAt`, `cancelledAt`, `completedAt`,
            null until it happens, GEN-11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBooking'
        '400':
          description: Invalid passengers or baggage (same rules as POST /api/flight-bookings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Validation failed", "fieldErrors": [{"field": "passengers.0.dateOfBirth", "messages": ["dateOfBirth must be YYYY-MM-DD"]}], "path": "/api/flight-bookings/hold", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/flight-bookings/hold", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Flight not found.", "path": "/api/flight-bookings/hold", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: Not enough seats left, or the flight is not scheduled or has departed, or its airline is deactivated. For a round trip nothing is held if either flight fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "Not enough seats left in economy on flight NA101, or the flight can no longer be booked.", "path": "/api/flight-bookings/hold", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flight-bookings:
    post:
      operationId: postFlightBookings
      tags: [Flight Booking]
      summary: 'Enter passengers and baggage and get the booking summary (FLT-19, FLT-21)'
      description: |
        **Access:** registered users (role `user`).

        Validates the passenger details and extra baggage and returns the booking summary to show before
        payment (flights, passengers, baggage, total). **Nothing is reserved or saved yet**: when the
        user continues, the frontend sends the same body to `POST /api/flight-bookings/hold`.

        - Each passenger has a full name, date of birth and passport or ID number (FLT-19).
        - The passenger type must match the date of birth on the departure date: adult 12+, child 2-11,
          infant under 2. At least one adult, and no more infants than adults (FLT-12).
        - Adults and children pay the cabin fare and take a seat; infants pay 10% of the fare and take
          no seat (FLT-12).
        - Extra bags per passenger are limited by the airline's maximum, and each bag's weight by the
          cabin's maximum bag weight; their fees are added to the total (FLT-08, FLT-19).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightBookingRequest'
      responses:
        '200':
          description: |
            The summary - each segment's flight (number, airports, local times) and cabin, each
            passenger with type and extra bags, the fare per passenger, baggage fees, and the total in
            cents.
        '400':
          description: Invalid passengers or baggage, or one of the rules above is broken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid passengers or baggage, or one of the rules above is broken.", "path": "/api/flight-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not a registered user.", "path": "/api/flight-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Flight not found.", "path": "/api/flight-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The flight is not scheduled, or not enough seats are left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The flight is not scheduled, or not enough seats are left.", "path": "/api/flight-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
    get:
      operationId: getFlightBookings
      tags: [Flight Booking]
      summary: 'List own flight bookings (FLT-25)'
      description: |
        **Access:** registered users. Only the user's own bookings are listed (ACC-11).

        Grouped as Upcoming, Past and Cancelled: choose the group with `group`.
      security: *auth
      parameters:
        - name: group
          in: query
          description: Defaults to `upcoming`.
          schema:
            $ref: '#/components/schemas/BookingGroup'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Each item - id, booking reference, flight(s), departure date, number of passengers, cabin, status.
          content: *paginated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/flight-bookings/{id}:
    get:
      operationId: getFlightBookingsById
      tags: [Flight Booking]
      summary: 'Get own flight booking details (FLT-25)'
      description: |
        **Access:** the user who made the booking (ACC-11).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: |
            Full details - reference (after confirmation), status, holdExpiresAt (while pending),
            segments with local times, passengers, extra baggage, agreed prices and total, the time the
            policies were accepted, the time of each status change (GEN-11), the payment status, and the
            refund with its status (PAY-03).
            For an upcoming Confirmed booking it also shows the refund the user would get if they
            cancelled now, computed from the airline's tiers (FLT-26), as `cancellation`
            (`CancellationPreview`, the same calculation `POST .../cancel` uses).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightBookingDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Booking not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking not found, or it belongs to another user.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flight-bookings/{id}/cancel:
    post:
      operationId: postFlightBookingsByIdCancel
      tags: [Flight Booking]
      summary: 'Cancel own flight booking (FLT-26)'
      description: |
        **Access:** the user who made the booking. The user first sees the refund amount (shown in the
        booking details) and confirms (GEN-03).

        Only a Confirmed booking, and only before departure. The booking becomes `cancelled`, its seats
        return to inventory, and a refund is created from the airline's tiers on the days remaining
        before departure (FLT-09, PAY-03). A round trip is cancelled as a whole using the outbound
        segment's tier (FLT-12). The user gets an in-app notification (GEN-01).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: |
            The cancelled booking (same fields as the hold response, status `cancelled`, `cancelledAt`)
            with `refund` - the refund created (amount in cents, refundPercentage, tierDaysBefore,
            status), or null when the tier gives 0%.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledFlightBooking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Booking not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking not found.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The booking is not Confirmed, or the flight has already departed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "This booking is no longer confirmed and cannot be cancelled.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flight-bookings/{id}/change-flight:
    patch:
      operationId: patchFlightBookingsByIdChangeFlight
      tags: [Flight Booking]
      summary: '[Bonus] Change the date or flight of a booking (FLT-27)'
      description: |
        **Access:** the user who made the booking.

        Moves one segment of a Confirmed booking to another flight on the same route and in the same
        cabin, subject to seat availability. A higher fare is paid through Stripe; a lower fare is
        refunded.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeFlightRequest'
      responses:
        '200':
          description: The updated booking, with the fare difference to pay or refund.
        '400':
          description: The new flight is not on the same route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "The new flight is not on the same route.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/change-flight", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Booking or flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking or flight not found.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/change-flight", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The booking is not Confirmed, or the new flight has no seats left in that cabin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The booking is not Confirmed, or the new flight has no seats left in that cabin.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/change-flight", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flight-bookings/{id}/e-ticket:
    get:
      operationId: getFlightBookingsByIdETicket
      tags: [Flight Booking]
      summary: 'Download the e-ticket as PDF (FLT-23)'
      description: |
        **Access:** the user who made the booking. Only for Confirmed bookings.

        The e-ticket shows the booking reference, passengers, flights with local times, cabin and
        baggage. The file is named `e-ticket-<reference>.pdf`.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The e-ticket PDF file.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/e-ticket", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Booking not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking not found.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/e-ticket", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The booking is not Confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "This booking is pending_payment; the e-ticket is only available for a confirmed booking.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/e-ticket", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flight-bookings/{id}/seat:
    patch:
      operationId: patchFlightBookingsByIdSeat
      tags: [Flight Booking]
      summary: '[Bonus] Select a seat (FLT-28)'
      description: |
        **Access:** the user who made the booking.

        Chooses a seat for one passenger on one segment. Infants have no seat.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectSeatRequest'
      responses:
        '200':
          description: The booking with the selected seat.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Booking not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Booking not found, or it belongs to another user.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/seat", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The seat is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The seat is already taken.", "path": "/api/flight-bookings/665f1c2a9b1e8a00123400a1/seat", "timestamp": "2026-11-01T10:00:00.000Z"}

  # ---------------------------------------------------------------------------
  # 8.5 Hotels and Rooms
  # ---------------------------------------------------------------------------

  /api/hotels:
    post:
      operationId: postHotels
      tags: [Hotels and Rooms]
      summary: 'Create a hotel profile (HTL-01)'
      description: |
        **Access:** admin.

        Creates an active hotel. The city and country come from the predefined lists, and the city must
        belong to the country (NEW-05). Photos follow the shared upload rule: JPG or PNG, at most 5 MB
        each, up to 5 per hotel (GEN-08). The check-in/check-out times and cancellation tiers are set by
        the hotel moderator with `PUT /api/hotels/{id}/policies`. A hotel moderator is then created with
        `POST /api/admin/moderators` (ACC-13).
      security: *auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HotelForm'
      responses:
        '201':
          description: Hotel created. Returns the hotel with its photo URLs.
        '400':
          description: Invalid fields, an unknown city or country, a city outside the country, or photos that break the upload rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid fields, an unknown city or country, a city outside the country, or photos that break the upload rule.", "path": "/api/hotels", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/hotels", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/search:
    get:
      operationId: getHotelsSearch
      tags: [Hotels and Rooms]
      summary: 'Search hotels (HTL-11, HTL-12)'
      description: |
        **Access:** everyone, including guests.

        Lists active hotels that have at least `rooms` active rooms free for the whole stay (inside a
        bookable range, not blocked, not reserved and not held), whose combined maximum occupancy covers
        the guests (HTL-11). Give a city or a country. Check-out must be after check-in, and check-in
        cannot be in the past.

        - **Price filter:** inclusive minimum and maximum price per night of the cheapest qualifying
          room (HTL-12).
        - **Rating filter:** minimum average rating from 1 to 5; unrated hotels are excluded when this
          filter is set (HTL-12).
        - **Sorting:** by that price or by rating (HTL-12).
        - No match gives an empty list (GEN-04).
      security: []
      parameters:
        - name: city
          in: query
          description: city_id from the official cities dataset. Give city or country.
          schema:
            type: string
            example: cairo
        - name: country
          in: query
          description: Country code from the official countries dataset. Give city or country.
          schema:
            type: string
            example: EG
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2027-03-01'
        - name: checkOut
          in: query
          required: true
          description: The departure day; must be after checkIn.
          schema:
            type: string
            format: date
            example: '2027-03-05'
        - name: guests
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            example: 2
        - name: rooms
          in: query
          description: Number of rooms. Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: minPrice
          in: query
          description: Minimum price per night in cents, inclusive.
          schema:
            type: integer
            minimum: 0
            example: 5000
        - name: maxPrice
          in: query
          description: Maximum price per night in cents, inclusive.
          schema:
            type: integer
            minimum: 0
            example: 30000
        - name: minRating
          in: query
          description: Minimum average rating (1-5).
          schema:
            type: number
            minimum: 1
            maximum: 5
            example: 4
        - name: sortBy
          in: query
          schema:
            $ref: '#/components/schemas/HotelSortBy'
        - name: sortOrder
          in: query
          description: Defaults to `asc`.
          schema:
            $ref: '#/components/schemas/SortOrder'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Each hotel - id, name, city, country, star class, first photo, average rating, number of ratings, price per night of the cheapest qualifying room.
          content: *paginated
        '400':
          description: Missing city and country, invalid dates (check-out not after check-in, check-in in the past), or minPrice greater than maxPrice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Missing city and country, invalid dates (check-out not after check-in, check-in in the past), or minPrice greater than maxPrice.", "path": "/api/hotels/search", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}:
    get:
      operationId: getHotelsById
      tags: [Hotels and Rooms]
      summary: 'Get hotel details (HTL-02)'
      description: |
        **Access:** everyone, including guests.

        When `checkIn` and `checkOut` are given, the response also lists the rooms available for those
        dates (same rules as `GET /api/hotels/{id}/rooms/available`). Reviews are listed with
        `GET /api/hotels/{id}/reviews`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: checkIn
          in: query
          schema:
            type: string
            format: date
            example: '2027-03-01'
        - name: checkOut
          in: query
          schema:
            type: string
            format: date
            example: '2027-03-05'
        - name: guests
          in: query
          schema:
            type: integer
            minimum: 1
            example: 2
      responses:
        '200':
          description: |
            The hotel profile - name, address, city, country, description, star class, photos,
            amenities, check-in and check-out times, cancellation policy, average rating and number of
            ratings - and the available rooms when dates were given.
        '400':
          description: Invalid dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid dates.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel not found, or deactivated (ACC-15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel not found, or deactivated (ACC-15).", "path": "/api/hotels/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
    patch:
      operationId: patchHotelsById
      tags: [Hotels and Rooms]
      summary: 'Edit own hotel profile (HTL-01)'
      description: |
        **Access:** the hotel moderator assigned to this hotel (ACC-11, ACC-13).

        Send only the fields to change. New photos are added to the existing ones, and `removePhotoIds`
        removes photos; the hotel can have at most 5 photos in total (GEN-08).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HotelUpdateForm'
      responses:
        '200':
          description: The updated hotel.
        '400':
          description: Invalid fields, or photos that break the upload rule or exceed 5 in total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid fields, or photos that break the upload rule or exceed 5 in total.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this hotel.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel not found.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}/rooms:
    post:
      operationId: postHotelsByIdRooms
      tags: [Hotels and Rooms]
      summary: 'Add a room (HTL-03)'
      description: |
        **Access:** the hotel moderator assigned to this hotel.

        A room is an individually bookable unit. Its room number or name is unique within the hotel.
        The new room is active but cannot be booked until a bookable date range is added with
        `POST /api/hotels/{id}/rooms/{roomId}/availability` (HTL-04).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this hotel.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel not found.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The hotel already has a room with this number or name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The hotel already has a room with this number or name.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}/rooms/{roomId}:
    patch:
      operationId: patchHotelsByIdRoomsByRoomId
      tags: [Hotels and Rooms]
      summary: 'Edit or deactivate a room (HTL-05)'
      description: |
        **Access:** the hotel moderator assigned to this hotel.

        Edits beds, maximum occupancy and price per night (HTL-05). Price changes do not affect existing
        reservations. Setting `active` to false deactivates the room (HTL-06): this is rejected if the
        room has a Confirmed or Pending Payment reservation from today on, and deactivated rooms are
        excluded from search. Bookable dates are edited with the availability endpoints.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: The updated room.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this hotel.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel or room not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel or room not found.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The room cannot be deactivated because it has Confirmed or Pending Payment reservations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The room cannot be deactivated because it has Confirmed or Pending Payment reservations.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
    delete:
      operationId: deleteHotelsByIdRoomsByRoomId
      tags: [Hotels and Rooms]
      summary: 'Delete a room (HTL-06)'
      description: |
        **Access:** the hotel moderator assigned to this hotel. The frontend asks for confirmation
        first (GEN-03).

        Only rooms that have never been reserved can be deleted; otherwise deactivate the room instead.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/RoomId'
      responses:
        '204':
          description: Room deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this hotel.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel or room not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel or room not found.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The room has been reserved before and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The room has been reserved before and cannot be deleted.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}/rooms/available:
    get:
      operationId: getHotelsByIdRoomsAvailable
      tags: [Hotels and Rooms]
      summary: 'List the rooms available for the searched dates (HTL-15)'
      description: |
        **Access:** everyone, including guests.

        Lists the hotel's active rooms that are free for every night of the stay. The user selects one or
        more of them and books them together with `POST /api/hotel-bookings` (HTL-16).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2027-03-01'
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2027-03-05'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Each room - id, room number, type, beds, maximum occupancy, price per night, and total stay price (nights x price per night) in cents.
          content: *paginated
        '400':
