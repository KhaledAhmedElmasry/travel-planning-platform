  # ---------------------------------------------------------------------------
  # 8.6 Hotel Booking and Reviews
  # ---------------------------------------------------------------------------

  /api/hotel-bookings:
    post:
      operationId: postHotelBookings
      tags: [Hotel Booking and Reviews]
      summary: 'Book rooms - hold them for 10 minutes (HTL-16, HTL-18)'
      description: |
        **Access:** registered users (role `user`). A guest gets 401 and the frontend sends them to
        login and back (ACC-10).

        Books one or more rooms of the same hotel for the same dates as one reservation (HTL-16):
        - Each room gets its adults and children (ages 0-17); every room needs at least one guest, the
          reservation at least one adult, and no room can be above its maximum occupancy.
        - Each room can be selected once. Nights = checkOut - checkIn (checkOut is the departure day).
        - Total = the sum over rooms of nights x the room's price per night at booking time, in cents.

        All selected rooms are held together for 10 minutes as one `pending_payment` reservation
        (HTL-18). If any room overlaps a Confirmed reservation, an unexpired hold or a blocked range, the
        whole request is rejected and nothing is held. Concurrent requests can never reserve the same
        room for the same night.

        Next steps: `GET /api/bookings/hotel/{id}/policies`, accept them, then `POST /api/payments`.
        If the payment does not succeed within the hold, the reservation becomes `expired` and the rooms
        are released (NEW-01).
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelBookingRequest'
      responses:
        '201':
          description: |
            Reservation created - `id`, `reference` (null until confirmed), `status` pending_payment,
            `holdExpiresAt`, `hotel` (id, name), `checkIn` / `checkOut` (YYYY-MM-DD), `nights`, `rooms`
            (room number, type, beds, maximum occupancy, adults, childrenAges, pricePerNight and
            subtotal in cents), `guests` (adults, children), `totalAmount` in cents, `currency`,
            `policiesAcceptedAt`, `paymentId`,
            and the time of each status change (`confirmedAt`, `expiredAt`, `cancelledAt`, `completedAt`,
            null until it happens, GEN-11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelBooking'
        '400':
          description: Invalid dates (check-out not after check-in, check-in in the past), no adult, a room without guests, too many guests in a room, the same room twice, or rooms from different hotels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "checkOut must be after checkIn.", "path": "/api/hotel-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/hotel-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel or room not found, or the hotel is deactivated (ACC-15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel not found.", "path": "/api/hotel-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: At least one room is deactivated, outside its bookable dates, blocked, or already held or booked for one of the nights, so nothing was held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "At least one room is already reserved for these dates, so nothing was held.", "path": "/api/hotel-bookings", "timestamp": "2026-11-01T10:00:00.000Z"}
    get:
      operationId: getHotelBookings
      tags: [Hotel Booking and Reviews]
      summary: 'List own hotel reservations (HTL-20)'
      description: |
        **Access:** registered users. Only the user's own reservations are listed (ACC-11).

        Grouped as Upcoming, Past and Cancelled: choose the group with `group`.
      security: *auth
      parameters:
        - name: group
          in: query
          description: Defaults to `upcoming`.
          schema:
            $ref: '#/components/schemas/BookingGroup'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Each item - id, booking reference, hotel, rooms, check-in and check-out dates, guests, total, status.
          content: *paginated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/hotel-bookings/{id}:
    get:
      operationId: getHotelBookingsById
      tags: [Hotel Booking and Reviews]
      summary: 'Get own reservation details (HTL-20)'
      description: |
        **Access:** the user who made the reservation (ACC-11).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: |
            Full details - reference (after confirmation), status, holdExpiresAt (while pending), hotel
            with check-in and check-out times, dates, rooms with guests and prices, total, the time the
            policies were accepted, the time of each status change (GEN-11), the payment status, and the
            refund with its status (PAY-03).
            For an upcoming Confirmed reservation it also shows the refund the user would get if they
            cancelled now, computed from the hotel's tiers on the full total (HTL-21), as
            `cancellation` (`CancellationPreview`, the same calculation `POST .../cancel` uses).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelBookingDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Reservation not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Reservation not found, or it belongs to another user.", "path": "/api/hotel-bookings/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotel-bookings/{id}/cancel:
    post:
      operationId: postHotelBookingsByIdCancel
      tags: [Hotel Booking and Reviews]
      summary: 'Cancel own reservation (HTL-21)'
      description: |
        **Access:** the user who made the reservation. The user first sees the refund amount (shown in
        the reservation details) and confirms (GEN-03).

        Only a Confirmed reservation, only as a whole (no partial cancellation) and only before the
        check-in date. The reservation becomes `cancelled`, all its rooms are released for those dates,
        and a refund is created from the hotel's tiers on the full total (HTL-10, PAY-03). The user gets
        an in-app notification (GEN-01).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: |
            The cancelled reservation (same fields as the booking response, status `cancelled`,
            `cancelledAt`) with `refund` - the refund created (amount in cents, refundPercentage,
            tierDaysBefore, status), or null when the tier gives 0%.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledHotelBooking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a registered user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Only registered users can book, pay and cancel", "path": "/api/hotel-bookings/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Reservation not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Reservation not found.", "path": "/api/hotel-bookings/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The reservation is not Confirmed, or the check-in date has been reached (cancelling is possible until the day before check-in).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "This reservation is no longer confirmed and cannot be cancelled.", "path": "/api/hotel-bookings/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotel-bookings/{id}/review:
    post:
      operationId: postHotelBookingsByIdReview
      tags: [Hotel Booking and Reviews]
      summary: 'Review a completed stay (HTL-23)'
      description: |
        **Access:** the user who made the reservation.

        A Confirmed reservation becomes Completed once its check-out date has passed (NEW-01). The user
        can submit one rating (1-5) with an optional review of up to 1000 characters per Completed
        reservation, regardless of the number of rooms. The hotel's average rating is recalculated.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review created.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Reservation not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Reservation not found, or it belongs to another user.", "path": "/api/hotel-bookings/665f1c2a9b1e8a00123400a1/review", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The reservation is not Completed, or it already has a review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The reservation is not Completed, or it already has a review.", "path": "/api/hotel-bookings/665f1c2a9b1e8a00123400a1/review", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/reviews/{id}:
    patch:
      operationId: patchReviewsById
      tags: [Hotel Booking and Reviews]
      summary: 'Edit own review (HTL-23)'
      description: |
        **Access:** the author of the review. The hotel's average rating is recalculated.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: The updated review.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the author of this review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the author of this review.", "path": "/api/reviews/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Review not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Review not found.", "path": "/api/reviews/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
    delete:
      operationId: deleteReviewsById
      tags: [Hotel Booking and Reviews]
      summary: 'Delete own review (HTL-23)'
      description: |
        **Access:** the author of the review. The frontend asks for confirmation first (GEN-03).

        The hotel's average rating is recalculated.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Review deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the author of this review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the author of this review.", "path": "/api/reviews/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Review not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Review not found.", "path": "/api/reviews/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}/reviews:
    get:
      operationId: getHotelsByIdReviews
      tags: [Hotel Booking and Reviews]
      summary: 'List the reviews of a hotel (HTL-24)'
      description: |
        **Access:** everyone, including guests.

        Newest first. Reviews hidden by an admin are visible only to their author and admins (GEN-10).
        Reviews of deactivated users are shown as "Deleted user" (ACC-12).
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: The hotel's averageRating and ratingCount, and a paginated list of reviews - rating, review text, author name, date (and the moderator reply, if any).
          content: *paginated
