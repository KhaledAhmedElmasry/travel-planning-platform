        '404':
          description: Hotel not found, or deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel not found, or deactivated.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/available", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}/rooms/{roomId}/availability:
    post:
      operationId: postHotelsByIdRoomsByRoomIdAvailability
      tags: [Hotels and Rooms]
      summary: 'Add a bookable date range to a room (HTL-04)'
      description: |
        **Access:** the hotel moderator assigned to this hotel.

        Adds a range of nights in which the room can be booked. `from` is the first night and `to` is
        the last night (both inclusive). A room's bookable ranges must not overlap each other.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomAvailabilityRequest'
      responses:
        '201':
          description: The room's bookable ranges and blocked ranges.
        '400':
          description: Invalid dates (to before from).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid dates (to before from).", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this hotel.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel or room not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel or room not found.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The range overlaps another bookable range of the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The range overlaps another bookable range of the room.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}
    patch:
      operationId: patchHotelsByIdRoomsByRoomIdAvailability
      tags: [Hotels and Rooms]
      summary: 'Remove, block or unblock dates of a room (HTL-05, HTL-06)'
      description: |
        **Access:** the hotel moderator assigned to this hotel.

        - `remove`: removes bookable nights (HTL-05). Rejected for nights that have a Confirmed
          reservation.
        - `block`: blocks nights so they cannot be booked (HTL-06). Rejected if the range overlaps any
          Confirmed or Pending Payment reservation.
        - `unblock`: removes a block again.

        `from` and `to` are the first and last night (both inclusive).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomAvailabilityRequest'
      responses:
        '200':
          description: The room's bookable ranges and blocked ranges.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this hotel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this hotel.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel or room not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Hotel or room not found.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The nights overlap reservations, as described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The nights overlap reservations, as described above.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/rooms/665f1c2a9b1e8a00123400a1/availability", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/hotels/{id}/availability:
