              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this hotel.", "path": "/api/hotels/665f1c2a9b1e8a00123400a1/policies", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Hotel not found.
          content:
            application/json:
              schema:
