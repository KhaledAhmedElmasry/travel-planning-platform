          content: *paginated
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/admin/audit-logs", "timestamp": "2026-11-01T10:00:00.000Z"}

  # ---------------------------------------------------------------------------
  # 8.3 Airlines, Flights, and Flight Inventory
  # ---------------------------------------------------------------------------

  /api/airlines:
    post:
      operationId: postAirlines
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Create an airline profile (FLT-01)'
      description: |
        **Access:** admin.

        Creates an active airline with a name, a unique code and an optional logo. The logo follows the
        shared upload rule: JPG or PNG, at most 5 MB, one logo per airline (GEN-08). An airline
        moderator is then created with `POST /api/admin/moderators` (ACC-13).
      security: *auth
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AirlineForm'
      responses:
        '201':
          description: Airline created. Returns id, name, code, logo URL and status.
        '400':
          description: Invalid fields, or a logo that is not JPG/PNG or is larger than 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid fields, or a logo that is not JPG/PNG or is larger than 5 MB.", "path": "/api/airlines", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an admin.", "path": "/api/airlines", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: Another airline already uses this code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "Another airline already uses this code.", "path": "/api/airlines", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/airlines/{id}:
    get:
      operationId: getAirlinesById
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Get an airline profile (FLT-01)'
      description: |
        **Access:** everyone, including guests.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Name, code, logo URL, extra-baggage policy (FLT-08) and cancellation tiers (FLT-09).
        '404':
          description: Airline not found, or deactivated (ACC-15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Airline not found, or deactivated (ACC-15).", "path": "/api/airlines/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
    patch:
      operationId: patchAirlinesById
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Edit own airline profile (FLT-01)'
      description: |
        **Access:** the airline moderator assigned to this airline (ACC-11, ACC-13).

        Edits name, code and logo. Send only the fields to change. A new logo replaces the old one
        (one logo per airline, GEN-08).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AirlineUpdateForm'
      responses:
        '200':
          description: The updated airline.
        '400':
          description: Invalid fields, or a logo that is not JPG/PNG or is larger than 5 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid fields, or a logo that is not JPG/PNG or is larger than 5 MB.", "path": "/api/airlines/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this airline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this airline.", "path": "/api/airlines/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Airline not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Airline not found.", "path": "/api/airlines/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: Another airline already uses this code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "Another airline already uses this code.", "path": "/api/airlines/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/airports:
    get:
      operationId: getAirports
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'List airports (FLT-03, FLT-11)'
      description: |
        **Access:** everyone, including guests.

        The predefined, read-only airport list loaded at setup from the official dataset, with an IANA
        time zone added for each airport (FLT-02, GEN-12). Flight creation and flight search accept only
        airports from this list.
      security: []
      parameters:
        - name: search
          in: query
          description: Part of the IATA code, airport name or city name (case-insensitive).
          schema:
            type: string
            example: cai
        - name: city
          in: query
          description: city_id from the official cities dataset.
          schema:
            type: string
            example: cairo
        - name: country
          in: query
          description: Country code from the official countries dataset.
          schema:
            type: string
            example: EG
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Each item - iataCode, name, cityId, city name, countryCode, timeZone (e.g. Africa/Cairo).
          content: *paginated
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/flights:
    post:
      operationId: postFlights
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Create a flight (FLT-03)'
      description: |
        **Access:** airline moderators. The flight belongs to the moderator's own airline.

        Departure and arrival are entered in each airport's local time and stored in UTC (GEN-06). The
        new flight has status `scheduled` (FLT-30) and no cabins yet; add them with
        `POST /api/flights/{id}/cabins`.

        Rejected when: an airport is not in the airport list (FLT-02), the two airports are identical,
        the arrival is not after the departure (compared in UTC), the departure is in the past, or the
        airline already has this flight number on the same departure date.
      security: *auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlightRequest'
      responses:
        '201':
          description: Flight created. Returns the flight with local and UTC times.
        '400':
          description: Invalid fields or one of the rules above is broken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid fields or one of the rules above is broken.", "path": "/api/flights", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an airline moderator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not an airline moderator.", "path": "/api/flights", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The airline already has this flight number on that departure date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The airline already has this flight number on that departure date.", "path": "/api/flights", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flights/search:
    get:
      operationId: getFlightsSearch
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Search flights (FLT-11, FLT-12, FLT-15)'
      description: |
        **Access:** everyone, including guests.

        Lists `scheduled` flights of active airlines on the departure date (the local date at the
        departure airport) whose available seats (total - booked - held) cover the passengers in the
        chosen cabin, or in at least one cabin when no cabin is given. Adults and children need a seat;
        infants do not (FLT-12).

        - **Round trip:** returns outbound and return options. They are booked together as one booking
          with two segments, one payment and one reference (FLT-12).
        - **Passengers:** at least one adult, and no more infants than adults.
        - **Price filter:** inclusive minimum and maximum of the cabin fare. `minPrice` greater than
          `maxPrice` gives 400 (FLT-15).
        - **Sorting:** by price, duration or departure time (FLT-15).
        - No match gives an empty list, shown as "no flights found" (GEN-04).
      security: []
      parameters:
        - name: origin
          in: query
          required: true
          description: IATA code of the departure airport.
          schema:
            type: string
            example: CAI
        - name: destination
          in: query
          required: true
          description: IATA code of the arrival airport.
          schema:
            type: string
            example: DXB
        - name: departureDate
          in: query
          required: true
          description: Local date at the departure airport.
          schema:
            type: string
            format: date
            example: '2027-03-01'
        - name: tripType
          in: query
          description: Defaults to `one_way`.
          schema:
            $ref: '#/components/schemas/TripType'
        - name: returnDate
          in: query
          description: Required for `round_trip`. Not before departureDate.
          schema:
            type: string
            format: date
            example: '2027-03-10'
        - name: adults
          in: query
          description: Passengers aged 12 or more. At least 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: children
          in: query
          description: Passengers aged 2 to 11.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: infants
          in: query
          description: Passengers under 2. No more than adults.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: cabinClass
          in: query
          description: Optional cabin filter (FLT-12).
          schema:
            $ref: '#/components/schemas/CabinClass'
        - name: minPrice
          in: query
          description: Minimum fare in cents, inclusive.
          schema:
            type: integer
            minimum: 0
            example: 10000
        - name: maxPrice
          in: query
          description: Maximum fare in cents, inclusive.
          schema:
            type: integer
            minimum: 0
            example: 50000
        - name: sortBy
          in: query
          schema:
            $ref: '#/components/schemas/FlightSortBy'
        - name: sortOrder
          in: query
          description: Defaults to `asc`.
          schema:
            $ref: '#/components/schemas/SortOrder'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: |
            One-way: a paginated list. Round trip: an object with an `outbound` and a `return` list,
            each in the same paginated format.

            Each flight - id, airline (name, code, logo), flight number, departure and arrival airports,
            local departure and arrival times with time zones, duration, and each matching cabin with
            its fare and seats available.
          content: *paginated
        '400':
          description: Missing or invalid search fields, an airport not in the list, minPrice greater than maxPrice, more infants than adults, or round trip without returnDate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Missing or invalid search fields, an airport not in the list, minPrice greater than maxPrice, more infants than adults, or round trip without returnDate.", "path": "/api/flights/search", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flights/{id}:
    get:
      operationId: getFlightsById
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Get flight details (FLT-17)'
      description: |
        **Access:** everyone, including guests.
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: |
            Airline, flight number, airports, local departure and arrival times with time zones (GEN-06),
            duration, status, each cabin with its fare, seats remaining and free baggage allowance, the
            extra-baggage policy (FLT-08) and the airline's cancellation policy (FLT-09).
        '404':
          description: Flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Flight not found.", "path": "/api/flights/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
    patch:
      operationId: patchFlightsById
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Edit a flight (FLT-05)'
      description: |
        **Access:** the airline moderator of the flight's airline.

        Only `scheduled` flights can be edited. Send only the fields to change; the FLT-03 rules still
        apply. Airports cannot be changed once the flight has any booking.

        Time changes apply to existing bookings, and passengers with Confirmed bookings get an in-app
        notification (GEN-01, NEW-02). Fares and seat counts are edited per cabin with
        `PATCH /api/flights/{id}/cabins/{cabinId}`.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlightRequest'
      responses:
        '200':
          description: The updated flight.
        '400':
          description: Invalid fields or an FLT-03 rule is broken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 400, "error": "BAD_REQUEST", "message": "Invalid fields or an FLT-03 rule is broken.", "path": "/api/flights/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this flight's airline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this flight's airline.", "path": "/api/flights/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Flight not found.", "path": "/api/flights/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The flight is not scheduled, or the airports cannot change because the flight has bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The flight is not scheduled, or the airports cannot change because the flight has bookings.", "path": "/api/flights/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flights/{id}/cancel:
    post:
      operationId: postFlightsByIdCancel
      tags: ['Airlines, Flights, and Flight Inventory']
      summary: 'Cancel a flight (FLT-06)'
      description: |
        **Access:** the airline moderator of the flight's airline. The frontend asks for confirmation
        first (GEN-03).

        The flight becomes `cancelled` and is hidden from search. All its Confirmed bookings become
        Cancelled with a 100% refund (PAY-03). Pending Payment bookings expire and their held seats are
        released. Passengers get an in-app notification (GEN-01). A round-trip booking is cancelled as
        a whole when either of its flights is cancelled (NEW-02).
      security: *auth
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The cancelled flight and the number of bookings that were cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the moderator of this flight's airline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 403, "error": "FORBIDDEN", "message": "Not the moderator of this flight's airline.", "path": "/api/flights/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}
        '404':
          description: Flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Flight not found.", "path": "/api/flights/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}
        '409':
          description: The flight is not scheduled (already cancelled or departed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 409, "error": "CONFLICT", "message": "The flight is not scheduled (already cancelled or departed).", "path": "/api/flights/665f1c2a9b1e8a00123400a1/cancel", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/flights/{id}/cabins:
