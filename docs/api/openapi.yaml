      summary: 'Resolve a report (GEN-10)'
      description: |
        **Access:** admin.

        Resolves the report by dismissing it, hiding the content, or deleting the content. Hidden
        content is visible only to its author and admins. Other open reports about the same content
        are resolved with it. The action is written to the audit log (GEN-07).
      security: *auth
      parameters:
