                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Content not found.", "path": "/api/admin/content/flight/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}

  /api/admin/audit-logs:
