              schema:
                $ref: '#/components/schemas/Error'
              example: {"statusCode": 404, "error": "NOT_FOUND", "message": "Report not found.", "path": "/api/admin/reports/665f1c2a9b1e8a00123400a1", "timestamp": "2026-11-01T10:00:00.000Z"}
