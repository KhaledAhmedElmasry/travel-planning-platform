      summary: 'Delete a post, comment, review or itinerary (GEN-10)'
      description: |
        **Access:** admin. The frontend asks for confirmation first (GEN-03).

        Deletes inappropriate content directly, with or without a report. Open reports about it are
        closed as `content_deleted`. The action is written to the audit log (GEN-07).

        Note: GEN-10 also lets the admin hide content directly. The PDF has no endpoint for that; add
        one to this file when it is designed.
      security: *auth
      parameters:
        - $ref: '#/components/parameters/ContentTypePath'
        - $ref: '#/components/parameters/Id'
